name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      # Lint has pre-existing debt across the codebase (mostly generated
      # shadcn/ui primitives) that predates this workflow - informational
      # until that's paid down, so a real regression is visible without
      # blocking every PR on unrelated files.
      - run: pnpm check
        continue-on-error: true
