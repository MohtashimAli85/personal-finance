name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
            platform: linux
            artifacts: |
              release/*.AppImage
              release/*.deb
          - os: windows-latest
            name: win
            platform: win
            artifacts: |
              release/*.exe
          - os: macos-15
            name: mac-arm64
            platform: mac
            args: --arm64
            artifacts: |
              release/*.dmg
              release/*.zip
          - os: macos-15-intel
            name: mac-x64
            platform: mac
            args: --x64
            artifacts: |
              release/*.dmg
              release/*.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version v$version"
            exit 1
          fi
      - run: pnpm electron:build:${{ matrix.platform }} ${{ matrix.args }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Build macOS DMG
        if: matrix.platform == 'mac'
        shell: bash
        run: |
          zip=$(ls release/*-mac.zip)
          dmg="${zip%-mac.zip}.dmg"
          rm -rf /tmp/dmg-stage && mkdir /tmp/dmg-stage
          ditto -x -k "$zip" /tmp/dmg-stage
          ln -s /Applications /tmp/dmg-stage/Applications
          hdiutil create -volname "Personal Finance" -srcfolder /tmp/dmg-stage -fs APFS -format UDZO -ov "$dmg"
      - name: Verify macOS packages
        if: matrix.platform == 'mac'
        shell: bash
        run: |
          for f in release/*.zip; do ditto -x -k "$f" /tmp/zip-check; done
          for f in release/*.dmg; do
            hdiutil verify "$f"
            hdiutil attach "$f" -readonly -nobrowse -mountpoint /tmp/dmg-mnt
            find /tmp/dmg-mnt -maxdepth 1 -name "*.app" | grep .
            hdiutil detach /tmp/dmg-mnt
          done
      - name: Verify Linux packages
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          for f in release/*.deb; do
            dpkg-deb --info "$f"
            dpkg-deb --contents "$f" | grep -E "\.node$"
          done
          for f in release/*.AppImage; do
            chmod +x "$f"
            "$f" --appimage-extract > /dev/null
            find squashfs-root -name "*.node" | grep .
          done
      - name: Verify Windows packages
        if: matrix.platform == 'win'
        shell: bash
        run: |
          for f in release/*.exe; do 7z t "$f"; done
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
